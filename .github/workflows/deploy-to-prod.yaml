name: Deploy to Salesforce (Prod)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Capture last Apex class commit message
        id: capture_commit_message
        shell: bash
        run: |
          COMMIT_RANGE="${{ github.event.before }}..${{ github.sha }}"
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            COMMIT_RANGE="${{ github.sha }}"
          fi
          COMMIT_SHA="$(git log -1 --format=%H "$COMMIT_RANGE" -- force-app/main/default/classes 2>/dev/null)"
          if [ -n "$COMMIT_SHA" ]; then
            COMMIT_MESSAGE="$(git log -1 --pretty=%B "$COMMIT_SHA" | tr -d '\r')"
          else
            COMMIT_MESSAGE="No Apex class commit found in ${COMMIT_RANGE}"
          fi
          echo "commit_message<<EOF" >> "$GITHUB_OUTPUT"
          echo "$COMMIT_MESSAGE" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Capture changed Apex classes
        id: capture_classes
        shell: bash
        run: |
          COMMIT_RANGE="${{ github.event.before }}..${{ github.sha }}"
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            COMMIT_RANGE="${{ github.sha }}"
          fi
          CHANGED_CLASSES=$(git diff --name-only "$COMMIT_RANGE" -- force-app/main/default/classes | grep '\.cls$' | sed 's#^force-app/main/default/classes/##' | sort -u | jq -R -s 'split("\n")[:-1] | map(select(. != "")) | map({name: ., path: ("force-app/main/default/classes/" + .)})')
          if [ -z "$CHANGED_CLASSES" ]; then
            CHANGED_CLASSES='[]'
          fi
          echo "changed_classes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGED_CLASSES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Install Salesforce CLI
        run: |
          npm install --global @salesforce/cli

      - name: Create JWT key file
        run: |
          echo "${{ secrets.JWT_SERVER_KEY }}" > server.key

      - name: Authenticate to Salesforce (JWT)
        id: sf_auth
        shell: bash
        run: |
          sf org login jwt \
            --client-id ${{ secrets.CONSUMER_KEY }} \
            --jwt-key-file server.key \
            --username ${{ secrets.DEPLOYMENT_USER_NAME }} \
            --instance-url ${{ secrets.INSTANCE_URL }} \
            --set-default
          ORG_INFO=$(sf org display --target-org ${{ secrets.DEPLOYMENT_USER_NAME }} --json)
          SF_ACCESS_TOKEN=$(echo "$ORG_INFO" | jq -r '.result.accessToken')
          SF_INSTANCE_URL=$(echo "$ORG_INFO" | jq -r '.result.instanceUrl')
          echo "sf_access_token<<EOF" >> "$GITHUB_OUTPUT"
          echo "$SF_ACCESS_TOKEN" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "sf_instance_url<<EOF" >> "$GITHUB_OUTPUT"
          echo "$SF_INSTANCE_URL" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create CommitClass__c records in Salesforce
        shell: bash
        env:
          SF_ACCESS_TOKEN: ${{ steps.sf_auth.outputs.sf_access_token }}
          SF_INSTANCE_URL: ${{ steps.sf_auth.outputs.sf_instance_url }}
          COMMIT_MESSAGE: ${{ steps.capture_commit_message.outputs.commit_message }}
          COMMIT_HASH: ${{ github.sha }}
          CHANGED_CLASSES: ${{ steps.capture_classes.outputs.changed_classes }}
        run: |
          CLASS_COUNT="$(echo "$CHANGED_CLASSES" | jq 'length')"
          if [ "$CLASS_COUNT" -eq 0 ]; then
            echo "No Apex classes changed — skipping CommitClass__c upsert."
            exit 0
          fi

          echo "Upserting $CLASS_COUNT CommitClass__c record(s)..."

          for i in $(seq 0 $((CLASS_COUNT - 1))); do
            CLASS_NAME="$(echo "$CHANGED_CLASSES" | jq -r ".[$i].name")"
            FILE_PATH="$(echo "$CHANGED_CLASSES" | jq -r ".[$i].path")"

            echo "  Processing class: $CLASS_NAME ($FILE_PATH)"

            PAYLOAD="$(jq -n \
              --arg name "$CLASS_NAME" \
              --arg cls  "$CLASS_NAME" \
              --arg path "$FILE_PATH" \
              --arg msg  "$COMMIT_MESSAGE" \
              --arg hash "$COMMIT_HASH" \
              '{\n                Name:                   $name,\n                Class_Name__c:          $cls,\n                File_Path__c:           $path,\n                Last_Commit_Message__c: $msg,\n                Commit_Hash__c:         $hash\n              }'\
            )"

            SOQL="SELECT Id FROM CommitClass__c WHERE Class_Name__c = '${CLASS_NAME}' AND Commit_Hash__c = '${COMMIT_HASH}' LIMIT 1"
            HTTP_CODE="$(curl -s -o /tmp/sf_query.json -w "%{http_code}" -G \
              --data-urlencode "q=${SOQL}" \
              -H "Authorization: Bearer $SF_ACCESS_TOKEN" \
              "${SF_INSTANCE_URL}/services/data/v62.0/query/")"

            echo "  Query HTTP status: $HTTP_CODE"
            if [ "$HTTP_CODE" -ge 400 ]; then
              echo "  Query error response:"
              cat /tmp/sf_query.json
              exit 1
            fi

            EXISTING="$(jq -r '.records[0].Id // empty' /tmp/sf_query.json)"

            if [ -n "$EXISTING" ]; then
              echo "  PATCH existing record $EXISTING for $CLASS_NAME"
              HTTP_CODE="$(curl -s -o /tmp/sf_upsert.json -w "%{http_code}" -X PATCH \
                -H "Authorization: Bearer $SF_ACCESS_TOKEN" \
                -H "Content-Type: application/json" \
                -d "$PAYLOAD" \
                "${SF_INSTANCE_URL}/services/data/v62.0/sobjects/CommitClass__c/${EXISTING}")"
            else
              echo "  POST new record for $CLASS_NAME"
              HTTP_CODE="$(curl -s -o /tmp/sf_upsert.json -w "%{http_code}" -X POST \
                -H "Authorization: Bearer $SF_ACCESS_TOKEN" \
                -H "Content-Type: application/json" \
                -d "$PAYLOAD" \
                "${SF_INSTANCE_URL}/services/data/v62.0/sobjects/CommitClass__c")"
            fi

            echo "  Upsert HTTP status: $HTTP_CODE"
            if [ "$HTTP_CODE" -ge 400 ]; then
              echo "  Upsert error response:"
              cat /tmp/sf_upsert.json
              exit 1
            fi

            echo "  Done: $CLASS_NAME"
          done

          echo "Done — all CommitClass__c records upserted."

      - name: Deploy to Salesforce
        run: |
          echo "Apex class commit message:"
          echo "${{ steps.capture_commit_message.outputs.commit_message }}"
          sf project deploy start \
            --target-org ${{ secrets.DEPLOYMENT_USER_NAME }} \
            --ignore-conflicts
