name: Deploy to Salesforce (Prod)
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Capture last Apex class commit message
        id: capture_commit_message
        shell: bash
        run: |
          COMMIT_RANGE="${{ github.event.before }}..${{ github.sha }}"
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            COMMIT_RANGE="${{ github.sha }}"
          fi
          echo "Scanning commit range: ${COMMIT_RANGE}"
          COMMIT_SHA="$(git log -1 --format=%H "$COMMIT_RANGE" -- force-app/main/default/classes 2>/dev/null)"
          if [ -n "$COMMIT_SHA" ]; then
            COMMIT_MESSAGE="$(git log -1 --pretty=%B "$COMMIT_SHA" | tr -d '\r')"
          else
            COMMIT_MESSAGE="No Apex class commit found in ${COMMIT_RANGE}"
          fi
          echo "commit_message<<EOF" >> "$GITHUB_OUTPUT"
          echo "$COMMIT_MESSAGE" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Create JWT key file
        run: echo "${{ secrets.JWT_SERVER_KEY }}" > server.key

      - name: Authenticate to Salesforce (JWT)
        run: |
          sf org login jwt \
            --client-id ${{ secrets.CONSUMER_KEY }} \
            --jwt-key-file server.key \
            --username ${{ secrets.DEPLOYMENT_USER_NAME }} \
            --instance-url ${{ secrets.INSTANCE_URL }} \
            --set-default

      - name: Deploy to Salesforce
        run: |
          echo "Apex class commit message:"
          echo "${{ steps.capture_commit_message.outputs.commit_message }}"
          sf project deploy start \
            --target-org ${{ secrets.DEPLOYMENT_USER_NAME }} \
            --ignore-conflicts

      - name: Create CommitClass__c records in Salesforce
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ steps.capture_commit_message.outputs.commit_message }}
          COMMIT_HASH: ${{ github.sha }}
          GIT_BEFORE: ${{ github.event.before }}
          GIT_AFTER: ${{ github.sha }}
          DEPLOYMENT_USER: ${{ secrets.DEPLOYMENT_USER_NAME }}
        run: |
          echo "Commit hash:  $COMMIT_HASH"

          # Rebuild changed classes list fresh
          COMMIT_RANGE="${GIT_BEFORE}..${GIT_AFTER}"
          if [ "$GIT_BEFORE" = "0000000000000000000000000000000000000000" ]; then
            COMMIT_RANGE="$GIT_AFTER"
          fi

          CHANGED_FILES="$(git diff --name-only "$COMMIT_RANGE" \
            -- 'force-app/main/default/classes/*.cls' 2>/dev/null || true)"

          CHANGED_CLASSES="[]"
          if [ -n "$CHANGED_FILES" ]; then
            CHANGED_CLASSES="$(echo "$CHANGED_FILES" | while IFS= read -r FILE; do
              [ -z "$FILE" ] && continue
              echo "$FILE"
            done | jq -R '{name: (. | split("/") | last | split(".cls") | first), path: .}' | jq -s '.')"
          fi

          echo "Changed classes: $CHANGED_CLASSES"

          CLASS_COUNT="$(echo "$CHANGED_CLASSES" | jq 'length')"
          if [ "$CLASS_COUNT" -eq 0 ]; then
            echo "No Apex classes changed — skipping CommitClass__c upsert."
            exit 0
          fi

          echo "Upserting $CLASS_COUNT CommitClass__c record(s)..."

          for i in $(seq 0 $((CLASS_COUNT - 1))); do
            CLASS_NAME="$(echo "$CHANGED_CLASSES" | jq -r ".[$i].name")"
            FILE_PATH="$(echo "$CHANGED_CLASSES"  | jq -r ".[$i].path")"

            echo "  Processing: $CLASS_NAME @ $FILE_PATH"

            # Query for existing record using sf data query
            EXISTING="$(sf data query \
              --target-org "$DEPLOYMENT_USER" \
              --query "SELECT Id FROM CommitClass__c WHERE Class_Name__c = '${CLASS_NAME}' AND Commit_Hash__c = '${COMMIT_HASH}' LIMIT 1" \
              --json 2>&1 | jq -r '.result.records[0].Id // empty')"

            echo "  Existing record: ${EXISTING:-none}"

            if [ -n "$EXISTING" ]; then
              echo "  Updating existing record $EXISTING"
              sf data update record \
                --target-org "$DEPLOYMENT_USER" \
                --sobject CommitClass__c \
                --record-id "$EXISTING" \
                --values "Class_Name__c='${CLASS_NAME}' File_Path__c='${FILE_PATH}' Last_Commit_Message__c='${COMMIT_MESSAGE}' Commit_Hash__c='${COMMIT_HASH}'" \
                && echo "  ✓ Updated: $CLASS_NAME" \
                || echo "  ✗ Update failed for: $CLASS_NAME"
            else
              echo "  Creating new record"
              sf data create record \
                --target-org "$DEPLOYMENT_USER" \
                --sobject CommitClass__c \
                --values "Class_Name__c='${CLASS_NAME}' File_Path__c='${FILE_PATH}' Last_Commit_Message__c='bound to error' Commit_Hash__c='${COMMIT_HASH}'" \
                && echo "  ✓ Created: $CLASS_NAME" \
                || echo "  ✗ Create failed for: $CLASS_NAME"
            fi

          done

          echo "Done — all CommitClass__c records processed."